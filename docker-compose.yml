services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Письма заявок в разработке уходят в Mailpit, а не наружу.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'OKOYOM_ENV', '${OKOYOM_ENV:-local}' );
        define( 'WP_DEBUG', ${WP_DEBUG:-true} );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      # Ядро WordPress живёт в томе, в репозиторий попадает только наш код.
      - wp-core:/var/www/html
      - ./wp-content/themes/okoyom:/var/www/html/wp-content/themes/okoyom
      - ./wp-content/plugins/okoyom-core:/var/www/html/wp-content/plugins/okoyom-core
      - ./uploads:/var/www/html/wp-content/uploads

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp-core:/var/www/html
      - ./wp-content/themes/okoyom:/var/www/html/wp-content/themes/okoyom
      - ./wp-content/plugins/okoyom-core:/var/www/html/wp-content/plugins/okoyom-core
      - ./uploads:/var/www/html/wp-content/uploads
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db-data:
  wp-core:
